
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <!-- LAYER 1: red ring (drawn as big red circle with white circle on top) -->
  <circle cx="256" cy="256" r="180" fill="#cc0000"/>
  <circle cx="256" cy="256" r="120" fill="white"/>

  <!-- LAYER 2: text -->
  <text x="256" y="240" text-anchor="middle" font-size="140" fill="#222222">YouTube</text>
  <text x="256" y="380" text-anchor="middle" font-size="200" fill="#222222">Kiosk</text>

  <!-- LAYER 3: slash (on top of everything) -->
