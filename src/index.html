<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Kiosk Control</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0e0e0e;
      --surface:   #1a1a1a;
      --border:    #2e2e2e;
      --dim:       #444;
      --text:      #d4d4d4;
      --muted:     #666;
      --kill:      #c0392b;
      --kill-glow: #e74c3c;
      --reboot:    #1a6b9a;
      --reboot-glow: #2980b9;
      --mono:      'Share Tech Mono', monospace;
      --sans:      'Barlow', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      overflow: hidden;
    }

    header {
      width: 100%;
      padding: 2rem 2rem 1rem;
      text-align: center;
    }

    .label {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    h1 {
      font-family: var(--mono);
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--text);
      letter-spacing: 0.1em;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--border);
      margin: 1.2rem auto;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 320px;
      padding: 0 2rem 3rem;
    }

    .btn {
      position: relative;
      width: 100%;
      padding: 1.2rem 1.5rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .btn::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
    }

    .btn-kill::before  { background: var(--kill); }
    .btn-reboot::before { background: var(--reboot); }

    .btn .btn-title {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
    }

    .btn .btn-desc {
      display: block;
      font-family: var(--sans);
      font-size: 0.7rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.03em;
      text-transform: none;
    }

    .btn:active,
    .btn.active {
      background: #222;
    }

    .btn-kill:active,
    .btn-kill.active  { border-color: var(--kill); }
    .btn-reboot:active,
    .btn-reboot.active { border-color: var(--reboot); }

    /* feedback flash */
    .btn.sent .btn-title::after {
      content: ' — sent';
      color: var(--muted);
      font-size: 0.7rem;
    }

    footer {
      position: fixed;
      bottom: 1.2rem;
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--dim);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <header>
    <p class="label">RPi4 &mdash; Kiosk Control</p>
    <h1>SYSTEM PANEL</h1>
  </header>

  <div class="divider"></div>

  <div class="controls">

    <button class="btn btn-kill" onclick="action(this, '/kill', 'Kill Chromium and exit kiosk mode?')">
      <span class="btn-title">KILL CHROMIUM</span>
      <span class="btn-desc">Exit kiosk mode, return to desktop</span>
    </button>

    <button class="btn btn-reboot" onclick="action(this, '/reboot', 'Reboot the Raspberry Pi?')">
      <span class="btn-title">REBOOT</span>
      <span class="btn-desc">Full system restart</span>
    </button>

  </div>

  <footer>LOCAL NETWORK ONLY</footer>

  <script>
    function action(btn, endpoint, message) {
      if (!confirm(message)) return;
      btn.classList.add('active');
      fetch(endpoint)
        .then(() => {
          btn.classList.remove('active');
          btn.classList.add('sent');
          setTimeout(() => btn.classList.remove('sent'), 3000);
        })
        .catch(() => {
          btn.classList.remove('active');
          alert('No response from server.');
        });
    }
  </script>

</body>
</html>
